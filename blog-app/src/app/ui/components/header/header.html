<header class="header">
  <nav class="nav container">
    <a [routerLink]="'/'" class="nav__logo">Name-folio</a>
    <ul class="nav__list">
      <li>
        <a
          [routerLink]="'/'"
          routerLinkActive="nav__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav__link"
        >About me</a>
      </li>
      <li>
        <a [routerLink]="'/blog'" routerLinkActive="nav__link--active" class="nav__link">Blog</a>
      </li>
      <li>
        <a [routerLink]="'/contacts'" routerLinkActive="nav__link--active" class="nav__link">Contact</a>
      </li>
    </ul>

    <div class="nav__auth">
      @if (authStore.isLoggedIn()) {
        <button mat-icon-button [matMenuTriggerFor]="userMenu" class="nav__user-btn" title="Аккаунт">
          <mat-icon>account_circle</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <div class="nav__user-info" mat-menu-item disabled>
            <mat-icon>person</mat-icon>
            <span>{{ authStore.user()?.username }}</span>
          </div>
          <button mat-menu-item (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Выход</span>
          </button>
        </mat-menu>
      } @else {
        <button class="nav__login-btn" (click)="openAuthDialog()">Вход</button>
      }
    </div>
  </nav>
</header>
